name: CI

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6"

env:
  DOCKER_REPOSITORY: abcfy2/mingw-cross-toolchain-ubuntu
  GHCR_REPOSITORY: ghcr.io/${{ github.repository_owner }}/mingw-cross-toolchain-ubuntu
  QUAY_IO_REPOSITORY: quay.io/${{ github.repository_owner }}/mingw-cross-toolchain-ubuntu

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - i686-w64-mingw32
          - x86_64-w64-mingw32	
    steps:
      - name: Determine if push is needed
        run: |
          set -eo pipefail
          echo "GITHUB_EVENT_NAME = ${GITHUB_EVENT_NAME}"
          PUSH=true
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            REPO_URL="https://github.com/cross-tools/mingw-cross"
            UPSTREAM_SHA256SUM="$(curl -sSLf --compressed "${REPO_URL}/releases/latest/download/${ARCH}.tar.xz.sha256")"
            DOWNSTREAM_SHA256SUM="$(docker run --pull=always --rm "${GHCR_REPOSITORY}:${ARCH}" cat /SHA256SUM.txt)" || true
            if [ "${UPSTREAM_SHA256SUM}" = "${DOWNSTREAM_SHA256SUM}" ]; then
              PUSH=false
            fi
          fi
          echo "PUSH = ${PUSH}"
          echo "PUSH=${PUSH}" >> $GITHUB_ENV
        env:
          ARCH: ${{ matrix.arch }}
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.GHCR_REPOSITORY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Quay.io
        uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.QUAY_IO_REPOSITORY }}
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        if: env.PUSH == 'true'
        with:
          push: true
          pull: true
          file: Dockerfile
          build-args: |
            ARCH=${{ matrix.arch }}
          tags: ${{ env.DOCKER_REPOSITORY }}:${{ matrix.arch }},${{ env.GHCR_REPOSITORY }}:${{ matrix.arch }},${{ env.QUAY_IO_REPOSITORY }}:${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
